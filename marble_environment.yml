name: marble
channels:
  - conda-forge
  - cdat
  - defaults

dependencies:
  - python=3.13.18
  - pip=26.2.2
  # xarray includes: pandas
  - xarray=2026.9.0
  - netcdf4=1.7.5
  # birdy incudes: owslib, lxml
  - birdy=0.10.0
  - h5netcdf=1.8.1
  - matplotlib=3.11.2
  - cartopy=0.26.0
  - bokeh=3.10.2
  - dask=2026.8.0
  - flox=0.11.2
  - cf_xarray=0.11.3
  - cfgrib=0.9.15.1
  - yq=4.4.5
  - jsonschema=4.26.0
  - nbval=0.11.0
  - nc-time-axis=1.4.1
  - aiohttp=3.14.5
  - scikit-image=0.26.0
  - ipyleaflet=0.20.0
  - ipywidgets=8.1.9
  - regionmask=0.13.0
  - siphon=0.11.0
  - gcsfs=2026.5.0
  - urlpath=2.0.0
  - seaborn=0.13.2
  - statsmodels=0.15.0
  - zarr=3.4.2
  # Universal Regridder for Geospatial Data
  # https://github.com/pangeo-data/xESMF
  # xesmf imcludes: numba, esmpy
  - xesmf=0.9.2
  # Sensitivity Analysis Library
  # https://anaconda.org/conda-forge/salib, https://github.com/SALib/SALib
  - salib=1.6.0
  - esgf-pyclient=0.3.2
  - geopy=2.5.0
  - pillow=13.0.0
  - openpyxl=3.1.5
  - intake=2.0.9
  - intake-esm=2025.12.12 # includes pydap
  - intake-xarray=2.0.0
  - intake-geopandas=0.4.0
  - intake-thredds=2025.2.18
  - s3fs=2026.9.0
  - pip:
    - requests-magpie==0.4.0
    - pystac-client==0.9.1
    - xncml==0.5.1
    - pyogrio==0.13.0 # moved to pip install because conda version doesn't support all python versions
    # https://pypi.org/project/fstd2nc/
    # Converts RPN standard files (from Environment Canada) to netCDF files.
    - fstd2nc==0.20260914.0
    - marble-client==1.3.2
